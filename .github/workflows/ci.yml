name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - run: npm run build
      - run: npm run build:web
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: |
          npm run test:browser > /tmp/test-log 2>&1 || { tail -100 /tmp/test-log | while IFS= read -r line; do echo "::warning::$line"; done; exit 1; }
