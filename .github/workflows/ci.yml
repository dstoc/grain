# Disposable grain/100 experiment. Do not merge this branch.
name: CI efficiency experiment
on: pull_request
permissions:
  contents: read
jobs:
  measure:
    name: Measure (${{ matrix.revision }}, ${{ matrix.repeat }})
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        revision: [baseline, candidate]
        repeat: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 92eac5d59ca38275539995e9ce3fd5b57b613a53
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision == 'baseline' && '0b500005bb26ebdbd0b8b891428ddd2b84bc4f30' || '92eac5d59ca38275539995e9ce3fd5b57b613a53' }}
          path: measured
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: measured/package-lock.json
      - run: python3 ../harness/scripts/ci/measure.py results/install.metrics.json npm ci
        working-directory: measured
      - run: python3 ../harness/scripts/ci/measure.py results/chromium-install.metrics.json ./node_modules/.bin/playwright install --with-deps chromium
        working-directory: measured
      - name: Static commands
        working-directory: measured
        run: |
          for script in build build:web lint check:boundaries analyze:unused analyze:unused:production format:check; do
            python3 ../harness/scripts/ci/measure.py "results/${script//:/-}.metrics.json" npm run "$script"
          done
      - run: python3 ../harness/scripts/ci/measure.py results/node.metrics.json npm run test -- --maxWorkers=2 --reporter=default --reporter=json --outputFile.json=results/node.vitest.json
        working-directory: measured
      - run: python3 ../harness/scripts/ci/measure.py results/browser.metrics.json npm run test:browser -- --reporter=default --reporter=json --outputFile.json=results/browser.vitest.json
        working-directory: measured
      - run: python3 ../harness/scripts/ci/measure.py results/smoke.metrics.json npm run test:extensive-smoke -- --maxWorkers=2 --reporter=default --reporter=json --outputFile.json=results/smoke.vitest.json
        working-directory: measured
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measurement-${{ matrix.revision }}-${{ matrix.repeat }}
          path: measured/results/
          if-no-files-found: error
  failed-test:
    runs-on: ubuntu-latest
    steps:
      - run: node --test --eval "require('node:test').test('intentional failed test', () => { throw new Error('grain/100 control'); })"
  timed-out:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: sleep 120
  skipped:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: exit 0
  failure-observer:
    if: always()
    needs: [failed-test, timed-out, skipped]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 92eac5d59ca38275539995e9ce3fd5b57b613a53
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          const needs = JSON.parse(process.env.CI_NEEDS);
          assert.equal(needs['failed-test'].result, 'failure');
          assert.equal(needs['timed-out'].result, 'failure');
          assert.equal(needs.skipped.result, 'skipped');
          JS
          if node scripts/ci/run.mjs aggregate --output missing-reports; then
            echo 'ERROR: aggregate passed without reports'
            exit 1
          fi
          node --test scripts/ci/partitions.test.mjs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
